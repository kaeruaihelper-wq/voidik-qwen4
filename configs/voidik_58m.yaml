# Compact single-GPU configuration for an architecture experiment.
# Count with: python -m tools.count_params --config configs/voidik_58m.yaml
model:
  vocab_size: 16384
  hidden_size: 640
  num_layers: 8
  layer_pattern: [gdn, gdn, gdn, qsa]
  tie_embeddings: true
  dropout: 0.0
  rms_norm_eps: 1.0e-6
  initializer_range: 0.02

  attention:
    num_heads: 10
    num_kv_heads: 2
    head_dim: 64
    window_size: 256
    sink_tokens: 4
    block_size: 32
    qk_norm: true
    rope_theta: 10000.0
    attention_dropout: 0.0
    output_gate: true

  gdn:
    num_k_heads: 2
    num_v_heads: 10
    head_k_dim: 64
    head_v_dim: 64
    conv_kernel: 4
    chunk_size: 32
    a_log_init_min: 1.0
    a_log_init_max: 16.0
    dt_bias_init_min: 0.001
    dt_bias_init_max: 0.1

  moe:
    enabled: true
    num_experts: 4
    top_k: 2
    expert_ff: 416
    shared_ff: 416
    aux_loss_coef: 0.01
    router_z_loss_coef: 0.001
    router_jitter: 0.0
    normalize_topk: true
    capacity_factor: 0.0

  residual_bank:
    enabled: true
    slots: 4
    slot_dim: 32
    read_bias_init: -2.0
    write_bias_init: -2.0
    merge_at_end: true

  ngram:
    enabled: true
    orders: [2, 3]
    buckets_per_order: 8192
    dim: 32
    inject_layer: 1
    scale: 1.0
    dropout: 0.0
    hash_seed: 0

  mtp:
    enabled: true
    depth: 1
    loss_weight: 0.1
    ffn_ff: 512
    aux_loss_coef: 0.0

data:
  train_glob: data/voidik_58m/tokens/train_*.bin
  val_glob: data/voidik_58m/tokens/val_*.bin
  block_size: 256
  token_dtype: uint16
  num_workers: 0
  prefetch_factor: 2
  pin_memory: true
  drop_last: true
  tokens_per_epoch: 40000000

train:
  output_dir: runs/voidik-58m-1000
  seed: 42
  dtype: bfloat16
  optimizer: adamw
  fused_adamw: true
  batch_size: 1
  grad_accum: 8
  max_steps: 1000
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 100
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip: 1.0
  log_every: 20
  eval_every: 500
  eval_batches: 20
  save_every: 500
  keep_last_checkpoints: 3
  gradient_checkpointing: true
  compile: false
  tensorboard: false
  log_csv: true
  resume: null
